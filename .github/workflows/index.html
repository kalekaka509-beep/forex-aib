<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forex H4 AI Signal</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>📈 Forex H4 AI Signal</h1>
  <p class="sub">Powered by Google Gemini</p>
  
  <div class="input-box">
    <select id="pair">
      <option value="EURUSD">EUR/USD</option>
      <option value="GBPUSD">GBP/USD</option>
      <option value="USDJPY">USD/JPY</option>
      <option value="XAUUSD">GOLD</option>
      <option value="BTCUSD">BTC/USD</option>
    </select>
    <button id="signalBtn">Get H4 Signal</button>
  </div>

  <div id="loading" style="display:none;">AI is analyzing H4 candles...</div>
  <div id="resultBox"></div>
</div>
<script src="script.js"></script>
</body>
</html>
